services:
  mysql:
    image: mysql:8.4
    container_name: inproveplan-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - inproveplan-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: inproveplan-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - inproveplan-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: inproveplan-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - inproveplan-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus
    container_name: inproveplan-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - inproveplan-prometheus-data:/prometheus

  inproveplan-api:
    image: ${API_IMAGE}
    container_name: inproveplan-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      prometheus:
        condition: service_started
    ports:
      - "${API_HTTP_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production

      ConnectionStrings__AppDbConnectionStrings: Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=root;Password=${MYSQL_ROOT_PASSWORD};
      ConnectionStrings__RedisConnection: redis:6379

      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__VirtualHost: /
      RabbitMq__Username: ${RABBITMQ_DEFAULT_USER}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS}

      JwtSettings__Issuer: InprovePlan
      JwtSettings__Audience: InprovePlan.Users
      JwtSettings__Secret: ${JWT_SECRET}

      PrometheusSettings__IP: prometheus
      PrometheusSettings__Port: 9090
      PrometheusSettings__TimeoutSeconds: 3
      PrometheusSettings__HttpDurationBucketMetric: http_request_duration_seconds_bucket
      PrometheusSettings__FailFastOnMetricMissing: "false"

volumes:
  inproveplan-mysql-data:
  inproveplan-redis-data:
  inproveplan-rabbitmq-data:
  inproveplan-prometheus-data: